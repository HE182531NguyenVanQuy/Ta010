<div class="auth-fullscreen-container">
  <div class="auth-card fade-in">
    <div class="auth-header">
      <div class="icon-circle accent">
        <span class="material-symbols-outlined">lock_reset</span>
      </div>
      <h1>Thiết lập mật khẩu mới</h1>
      <p>Vui lòng tạo mật khẩu mới an toàn để bảo vệ tài khoản.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <div class="form-group">
        <label>Mật khẩu mới</label>
        <div class="input-wrapper">
          <span class="material-symbols-outlined">lock</span>
          <input type="password" formControlName="newPassword" placeholder="Tối thiểu 8 ký tự" />
        </div>
        <div class="error-msg" *ngIf="form.controls['newPassword'].touched && form.controls['newPassword'].invalid">
          <span *ngIf="form.controls['newPassword'].errors?.['required']">Mật khẩu là bắt buộc.</span>
          <span *ngIf="form.controls['newPassword'].errors?.['minlength']">Mật khẩu phải từ 8 ký tự trở lên.</span>
        </div>
      </div>

      <div class="form-group">
        <label>Xác nhận mật khẩu mới</label>
        <div class="input-wrapper">
          <span class="material-symbols-outlined">key</span>
          <input type="password" formControlName="confirmPassword" placeholder="Nhập lại mật khẩu" />
        </div>
        <div class="error-msg" *ngIf="form.errors?.['mismatch'] && form.controls['confirmPassword'].touched">
          Mật khẩu xác nhận không khớp.
        </div>
      </div>

      <div class="password-requirements">
        <p>💡 Mẹo: Sử dụng kết hợp chữ hoa, chữ thường, số và ký tự đặc biệt.</p>
      </div>

      <button type="submit" class="btn-auth-primary" [disabled]="loading || form.invalid">
        <span *ngIf="!loading">Cập nhật mật khẩu</span>
        <div class="spinner-white" *ngIf="loading"></div>
      </button>

      <div class="server-error" *ngIf="error">{{ error }}</div>
    </form>
  </div>
</div>
