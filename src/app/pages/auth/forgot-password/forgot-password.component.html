<div class="auth-hero">
  <div class="auth-hero-blob1"></div>
  <div class="auth-hero-blob2"></div>
  <div class="auth-hero-inner">
    <div class="auth-card fade-up">
      <div class="auth-header">
        <div class="auth-logo">
          <span class="logo-text">T<span class="accent">aO</span>10</span>
        </div>
        <h1>Khôi phục mật khẩu</h1>
        <p>Nhập email của bạn để nhận mã OTP và đặt lại mật khẩu</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <div class="form-group" [class.has-error]="form.controls['email'].touched && form.controls['email'].invalid">
          <label>Email đăng ký</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined">mail</span>
            <input
              type="email"
              formControlName="email"
              placeholder="example@gmail.com"
              autocomplete="email"
            />
          </div>
          <div class="error-msg" *ngIf="form.controls['email'].touched && form.controls['email'].invalid">
            <span *ngIf="form.controls['email'].errors?.['required']">Vui lòng nhập email.</span>
            <span *ngIf="form.controls['email'].errors?.['email']">Định dạng email không hợp lệ.</span>
          </div>
        </div>

        <button type="submit" class="btn-auth-primary" [disabled]="loading || form.invalid">
          <span *ngIf="!loading">Gửi mã OTP</span>
          <span *ngIf="loading" class="spinner"></span>
        </button>

        <div class="server-error" *ngIf="error">{{ error }}</div>
      </form>

      <div class="auth-footer">
        <span>Nhớ mật khẩu?</span>
        <a routerLink="/login" class="link-primary">Đăng nhập ngay</a>
      </div>
    </div>
  </div>
</div>
