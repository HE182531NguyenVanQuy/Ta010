<div class="auth-fullscreen-container">
  <div class="auth-card fade-in">
    <div class="auth-header">
      <div class="auth-logo">
        <span class="logo-t">T</span><span class="logo-ao">aO</span><span class="logo-10">10</span>
      </div>
      <h1>Khôi phục mật khẩu</h1>
      <p>Nhập email của bạn, chúng tôi sẽ gửi mã OTP để xác thực.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <div class="form-group" [class.has-error]="form.controls['email'].touched && form.controls['email'].invalid">
        <label>Email đăng ký</label>
        <div class="input-wrapper">
          <span class="material-symbols-outlined">mail</span>
          <input 
            type="email" 
            formControlName="email" 
            placeholder="example@gmail.com"
            autocomplete="email"
          />
        </div>
        <div class="error-msg" *ngIf="form.controls['email'].touched && form.controls['email'].invalid">
          <span *ngIf="form.controls['email'].errors?.['required']">Vui lòng nhập email.</span>
          <span *ngIf="form.controls['email'].errors?.['email']">Định dạng email không hợp lệ.</span>
        </div>
      </div>

      <button type="submit" class="btn-auth-primary" [disabled]="loading || form.invalid">
        <span *ngIf="!loading">Gửi mã xác thực OTP</span>
        <div class="spinner-white" *ngIf="loading"></div>
      </button>

      <div class="server-error" *ngIf="error">{{ error }}</div>
    </form>

    <div class="auth-footer">
      <a routerLink="/login" class="link-back">
        <span class="material-symbols-outlined">arrow_back</span> Quay lại đăng nhập
      </a>
    </div>
  </div>
</div>
